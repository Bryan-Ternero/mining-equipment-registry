name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # nunca cancelar ejecuciones en main, así cada commit fusionado conserva su resultado
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equipment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equipment_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations apply on a clean database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Integration tests against PostgreSQL
        run: npx vitest run --config vitest.integration.config.ts
      - run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  deploy-script:
    name: deploy.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # historial y ramas completos: la verificación de downgrade compara commits
          fetch-depth: 0
      - name: Syntax
        run: bash -n deploy.sh
      - name: ShellCheck
        run: shellcheck deploy.sh
      - name: Fails with exit code 2 when variables and tools are missing
        run: |
          set +e
          ./deploy.sh > out.txt 2>&1
          code=$?
          cat out.txt
          test "$code" -eq 2 || exit 1
          grep -q "missing  variable PUBLIC_API_URL" out.txt || exit 1
          grep -q "missing  tool railway" out.txt
      - name: Fails with exit code 2 on an unknown argument
        run: |
          set +e
          ./deploy.sh --nope
          test "$?" -eq 2
      - name: Refuses to deploy a commit that is not on GitHub (exit 4)
        run: |
          # CLI falsas de los proveedores: responden las verificaciones de solo lectura y rechazan todo lo que publique
          mkdir -p "$RUNNER_TEMP/stubs"
          cat > "$RUNNER_TEMP/stubs/railway" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            whoami) echo "Logged in as ci" ;;
            variable) echo '{"AUTH_TOKEN_SECRET":"x","AUTH_SUPERVISOR_USERNAME":"s","AUTH_SUPERVISOR_PASSWORD_HASH":"scrypt:x","AUTH_OPERATOR_USERNAME":"o","AUTH_OPERATOR_PASSWORD_HASH":"scrypt:y"}' ;;
            *) echo "stub railway refuses: $*" >&2; exit 97 ;;
          esac
          EOF
          cat > "$RUNNER_TEMP/stubs/vercel" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            whoami) echo ci ;;
            link) exit 0 ;;
            *) echo "stub vercel refuses: $*" >&2; exit 97 ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/stubs/railway" "$RUNNER_TEMP/stubs/vercel"
          git -c user.name=ci -c user.email=ci@example.com commit --allow-empty -qm "ci: local commit that is not pushed"
          set +e
          PATH="$RUNNER_TEMP/stubs:$PATH" PUBLIC_API_URL=https://api.example.com PUBLIC_WEB_URL=https://web.example.com \
            RAILWAY_PROJECT_ID=ci VERCEL_PROJECT_NAME=ci ./deploy.sh > out.txt 2>&1
          code=$?
          cat out.txt
          test "$code" -eq 4 || exit 1
          grep -q "is not on GitHub yet" out.txt
      - name: Refuses to take production back to an older commit (exit 4)
        run: |
          # producción "corre" origin/main (/health falso); se despliega su padre, que está subido pero es más antiguo
          cat > "$RUNNER_TEMP/stubs/curl" <<'EOF'
          #!/usr/bin/env bash
          printf '{"status":"ok","db":"up","version":"%s"}' "$FAKE_PROD_VERSION"
          EOF
          chmod +x "$RUNNER_TEMP/stubs/curl"
          prod=$(git rev-parse --short origin/main)
          # un worktree aparte en el commit más antiguo, así los pasos siguientes conservan el checkout de este job
          git worktree add -q --detach "$RUNNER_TEMP/older" origin/main~1
          cp deploy.sh "$RUNNER_TEMP/older/deploy.sh"
          cd "$RUNNER_TEMP/older"
          set +e
          PATH="$RUNNER_TEMP/stubs:$PATH" FAKE_PROD_VERSION="$prod" PUBLIC_API_URL=https://api.example.com \
            PUBLIC_WEB_URL=https://web.example.com RAILWAY_PROJECT_ID=ci VERCEL_PROJECT_NAME=ci \
            ./deploy.sh --allow-dirty > "$RUNNER_TEMP/downgrade.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/downgrade.txt"
          test "$code" -eq 4 || exit 1
          grep -q "is not part of the history" "$RUNNER_TEMP/downgrade.txt"
      - name: Verifier refuses an invalid retry count
        run: |
          set +e
          PUBLIC_API_URL=https://a.example PUBLIC_WEB_URL=https://w.example VERIFY_ATTEMPTS=0 node scripts/verify-deploy.mjs > out.txt 2>&1
          code=$?
          cat out.txt
          test "$code" -eq 1 || exit 1
          grep -q "VERIFY_ATTEMPTS must be a positive integer" out.txt
