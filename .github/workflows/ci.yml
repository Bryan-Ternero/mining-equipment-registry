name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never cancel runs on main, so every merged commit keeps its result
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equipment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equipment_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations apply on a clean database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Integration tests against PostgreSQL
        run: npx vitest run --config vitest.integration.config.ts
      - run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  deploy-script:
    name: deploy.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n deploy.sh
      - name: ShellCheck
        run: shellcheck deploy.sh
      - name: Fails with exit code 2 when variables and tools are missing
        run: |
          set +e
          ./deploy.sh > out.txt 2>&1
          code=$?
          cat out.txt
          test "$code" -eq 2
          grep -q "missing  variable PUBLIC_API_URL" out.txt
          grep -q "missing  tool railway" out.txt
      - name: Fails with exit code 2 on an unknown argument
        run: |
          set +e
          ./deploy.sh --nope
          test "$?" -eq 2
      - name: Verifier refuses an invalid retry count
        run: |
          set +e
          PUBLIC_API_URL=https://a.example PUBLIC_WEB_URL=https://w.example VERIFY_ATTEMPTS=0 node scripts/verify-deploy.mjs > out.txt 2>&1
          code=$?
          cat out.txt
          test "$code" -eq 1
          grep -q "VERIFY_ATTEMPTS must be a positive integer" out.txt
