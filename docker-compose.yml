# Local PostgreSQL for development and integration tests.
# Published on 5433 so it does not clash with a native PostgreSQL on 5432.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equipment
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
