# Entorno local.
#
#   docker compose up -d db                  solo PostgreSQL (desarrollo y tests de integración)
#   docker compose --profile full up --build stack completo: db -> migraciones -> API -> web
#
# PostgreSQL se publica en 5433 para no chocar con un PostgreSQL nativo en 5432.
# Estas imágenes son solo para uso local: producción compila en Railway (API) y Vercel (web).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equipment
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment"]
      interval: 3s
      timeout: 3s
      retries: 20

  # aplica las migraciones pendientes una vez y termina; la API espera a que tenga éxito
  migrate:
    profiles: [full]
    build:
      context: apps/api
      dockerfile: Dockerfile.local
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/equipment?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [full]
    build:
      context: apps/api
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/equipment?schema=public
      PORT: "3001"
      WEB_ORIGIN: http://localhost:8080
      APP_VERSION: docker
      # las cuentas de login vienen de .env (nunca del repositorio); ver README "Cuentas de login".
      # Vacías cuando faltan, así "docker compose up db" sigue funcionando: la API entonces se
      # niega a arrancar y su log lista las variables faltantes.
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      AUTH_SUPERVISOR_USERNAME: ${AUTH_SUPERVISOR_USERNAME:-}
      AUTH_SUPERVISOR_PASSWORD_HASH: ${AUTH_SUPERVISOR_PASSWORD_HASH:-}
      AUTH_OPERATOR_USERNAME: ${AUTH_OPERATOR_USERNAME:-}
      AUTH_OPERATOR_PASSWORD_HASH: ${AUTH_OPERATOR_PASSWORD_HASH:-}
    ports:
      - "8081:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: [full]
    build:
      context: apps/web
      dockerfile: Dockerfile.local
      args:
        VITE_API_URL: http://localhost:8081
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
